name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (syntax errors and undefined names)
        run: flake8 . --select=E9,F63,F7,F82 --show-source --statistics
      - name: Tests (offline; API tests are skipped)
        run: pytest -v
